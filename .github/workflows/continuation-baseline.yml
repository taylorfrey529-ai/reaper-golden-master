name: Reaper Golden Master continuation baseline

on:
  push:
    branches:
      - main
      - development/reaperctl
      - mutable-restrictions-lifted
      - full-os-mutable-layer
      - candidate/reaper-debian-signing-key
  pull_request:

permissions:
  contents: read

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify inherited Golden Master baseline
        run: bash scripts/verify-baseline.sh
      - name: Verify secure mutable continuation policy
        if: github.ref_name == 'mutable-restrictions-lifted'
        run: bash scripts/verify-mutability.sh
      - name: Verify secure full OS mutable-layer policy
        if: github.ref_name == 'full-os-mutable-layer' || github.ref_name == 'candidate/reaper-debian-signing-key'
        run: bash scripts/verify-os-mutability.sh
      - name: Verify full OS system-change evidence
        if: github.ref_name == 'full-os-mutable-layer' || github.ref_name == 'candidate/reaper-debian-signing-key'
        run: python3 scripts/verify-system-change-manifests.py
      - name: Verify private Debian repository binding
        if: github.ref_name == 'full-os-mutable-layer'
        run: python3 scripts/verify-package-source-bindings.py
      - name: Verify Debian trust-root candidate
        if: github.ref_name == 'candidate/reaper-debian-signing-key'
        run: python3 scripts/verify-reaper-debian-trust-root-candidate.py
      - name: Compile control-plane tools
        run: |
          python3 -m py_compile bin/reaperctl
          python3 -m py_compile bin/reaperctl-core
          python3 -m py_compile scripts/configure-web-control.py
          python3 -m py_compile scripts/reaper-render.py
          python3 -m py_compile scripts/reaper-export-stems.py
          python3 -m py_compile scripts/reaper-align-drums.py
          python3 -m py_compile scripts/reaper-pan-drums.py
          python3 -m py_compile scripts/reaper-screenshot.py
          python3 -m py_compile scripts/reaper-snapshot.py
          python3 -m py_compile scripts/reaper-backup.py
          python3 -m py_compile scripts/reaper-restore.py
          python3 -m py_compile scripts/reaper-mutate.py
          python3 -m py_compile scripts/reaper-rollback.py
          python3 -m py_compile scripts/os-mutation-policy.py
          python3 -m py_compile scripts/verify-system-change-manifests.py
          python3 -m py_compile scripts/verify-package-source-bindings.py
          python3 -m py_compile scripts/verify-reaper-debian-trust-root-candidate.py
          python3 -m py_compile os/usr-local/bin/reaper-workspace-status
          python3 -m py_compile recovery/workspace/desktop_shell.py
          bash -n recovery/workspace/start-desktop.sh recovery/workspace/stop-desktop.sh scripts/verify-mutability.sh scripts/verify-os-mutability.sh os/install/install-dotnet-10.0.302.sh os/rollback/rollback-dotnet-10.0.302.sh os/rollback/rollback-reaper-workspace-status.sh
          if [ "${GITHUB_REF_NAME}" = "full-os-mutable-layer" ] || [ "${GITHUB_REF_NAME}" = "candidate/reaper-debian-signing-key" ]; then
            bash -n candidates/reaper-debian-signing-key/install-trust-root.sh candidates/reaper-debian-signing-key/rollback-trust-root.sh
          fi
      - name: Run reaperctl unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify continuation command routing
        run: |
          bin/reaperctl render --help >/dev/null
          bin/reaperctl export-stems --help >/dev/null
          bin/reaperctl align-drums --help >/dev/null
          bin/reaperctl pan-drums --help >/dev/null
          bin/reaperctl screenshot --help >/dev/null
          bin/reaperctl snapshot --help >/dev/null
          bin/reaperctl backup --help >/dev/null
          bin/reaperctl restore --help >/dev/null
          bin/reaperctl mutate --help >/dev/null
          bin/reaperctl mutate pan-drums --help >/dev/null
          bin/reaperctl mutate align-drums --help >/dev/null
          bin/reaperctl rollback --help >/dev/null
          if [ "${GITHUB_REF_NAME}" = "full-os-mutable-layer" ]; then
            python3 scripts/os-mutation-policy.py path /usr/local/bin/tool --json >/dev/null
            python3 scripts/os-mutation-policy.py path /opt/dotnet-10.0.302 --json >/dev/null
            python3 scripts/os-mutation-policy.py path /etc/profile.d/dotnet-10.0.302.sh --json >/dev/null
            python3 scripts/os-mutation-policy.py package cmake --json >/dev/null
            set +e
            python3 scripts/os-mutation-policy.py path /mnt/data/reaper-apt-repository --json >/dev/null
            rc0=$?
            python3 scripts/os-mutation-policy.py path /etc/apt/keyrings/reaper-debian-repo.gpg --json >/dev/null
            rc1=$?
            python3 scripts/os-mutation-policy.py path /etc/apt/sources.list.d/reaper-debian-repo.sources --json >/dev/null
            rc2=$?
            set -e
            test "$rc0" -eq 3
            test "$rc1" -eq 3
            test "$rc2" -eq 3
            python3 scripts/os-mutation-policy.py package reaper-workspace-status --json >/dev/null
          fi
          if [ "${GITHUB_REF_NAME}" = "candidate/reaper-debian-signing-key" ]; then
            set +e
            python3 scripts/os-mutation-policy.py path /mnt/data/reaper-apt-repository --json >/dev/null
            rc0=$?
            python3 scripts/os-mutation-policy.py path /etc/apt/keyrings/reaper-debian-repo.gpg --json >/dev/null
            rc1=$?
            python3 scripts/os-mutation-policy.py path /etc/apt/sources.list.d/reaper-debian-repo.sources --json >/dev/null
            rc2=$?
            set -e
            test "$rc0" -eq 3
            test "$rc1" -eq 3
            test "$rc2" -eq 3
            python3 scripts/os-mutation-policy.py package reaper-workspace-status --json >/dev/null
          fi
      - name: Run static reaperctl health gate
        run: bin/reaperctl health --static --json
