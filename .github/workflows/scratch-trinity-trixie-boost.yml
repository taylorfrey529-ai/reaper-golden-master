name: scratch-trinity-trixie-boost

on:
  push:
    branches:
      - scratch/trinity-trixie-boost-20260914

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install exact Trixie development components
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates tar gzip coreutils \
            libboost1.83-dev \
            libboost-filesystem1.83-dev \
            libboost-program-options1.83-dev \
            libboost-regex1.83-dev \
            libboost-locale1.83-dev \
            libreadline-dev

      - name: Assemble workspace overlay
        run: |
          set -eux
          out="$GITHUB_WORKSPACE/trinity-tixie-dev-overlay"
          mkdir -p "$out/usr/include" "$out/usr/lib/x86_64-linux-gnu/cmake"
          cp -a /usr/include/boost "$out/usr/include/"
          cp -a /usr/include/readline "$out/usr/include/"
          for f in /usr/lib/x86_64-linux-gnu/libboost_*.so* /usr/lib/x86_64-linux-gnu/libreadline.so* /usr/lib/x86_64-linux-gnu/libhistory.so*; do
            [ -e "$f" ] && cp -a "$f" "$out/usr/lib/x86_64-linux-gnu/"
          done
          for entry in /usr/lib/x86_64-linux-gnu/cmake/Boost* /usr/lib/x86_64-linux-gnu/cmake/boost_*; do
            [ -e "$entry" ] && cp -a "$entry" "$out/usr/lib/x86_64-linux-gnu/cmake/"
          done
          dpkg-query -W 'libboost*' 'libreadline*' | sort > "$GITHUB_WORKSPACE/dev-packages.txt"
          tar -C "$GITHUB_WORKSPACE" -czf "$GITHUB_WORKSPACE/trinity-tixie-dev-overlay.tar.gz" trinity-tixie-dev-overlay
          sha256sum "$GITHUB_WORKSPACE/trinity-tixie-dev-overlay.tar.gz" > "$GITHUB_WORKSPACE/trinity-tixie-dev-overlay.tar.gz.sha256"

      - name: Upload overlay
        uses: actions/upload-artifact@v4
        with:
          name: trinity-tixie-dev-overlay
          path: |
            trinity-tixie-dev-overlay.tar.gz
            trinity-tixie-dev-overlay.tar.gz.sha256
            dev-packages.txt
          if-no-files-found: error
          retention-days: 1
